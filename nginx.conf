events {
    worker_connections 1024;
}

http {
    upstream boq_app {
        server web:5000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=boq_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        # Redirect to HTTPS (if using SSL)
        # return 301 https://$host$request_uri;

        client_max_body_size 50M;

        location / {
            limit_req zone=boq_limit burst=20 nodelay;

            proxy_pass http://boq_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for BOQ processing
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        location /static {
            alias /app/static;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /health {
            proxy_pass http://boq_app/health;
            access_log off;
        }
    }

    # HTTPS configuration (uncomment if using SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     client_max_body_size 50M;
    #
    #     location / {
    #         limit_req zone=boq_limit burst=20 nodelay;
    #         proxy_pass http://boq_app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_connect_timeout 300;
    #         proxy_send_timeout 300;
    #         proxy_read_timeout 300;
    #     }
    #
