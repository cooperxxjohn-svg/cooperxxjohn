ductwork:
  trade: hvac
  items:
    - code: DIV23-3100
      description: "Rectangular Sheet Metal Ductwork"
      unit: LF
      formula: "length_ft or 0"

    - code: DIV23-3300
      description: "Duct Insulation - 2\" Fiberglass Wrap"
      unit: LF
      formula: "length_ft or 0"

chiller:
