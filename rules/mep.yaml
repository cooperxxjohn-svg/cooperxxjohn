# Assembly rules — MEP (Mechanical, Electrical, Plumbing)

# ── MECHANICAL ──────────────────────────────────────────────────────────────

ahu:
  trade: hvac
  items:
    - code: DIV23-7300
      description: "Air Handling Unit - Supply & Install"
      unit: EA
      formula: "count"

    - code: DIV23-3100
      description: "Supply Ductwork - Main Trunk (estimated)"
      unit: LF
      formula: "count * 40"  # ~40 LF per AHU rough estimate

vav_box:
  trade: hvac
  items:
    - code: DIV23-3600
      description: "VAV Terminal Box - Supply & Install"
      unit: EA
      formula: "count"

